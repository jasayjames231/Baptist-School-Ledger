    --red:#A8322A; --gold:#C79A3E; --line:#D9D2C2; --green:#2E6E4E; --green-bg:#E4EFE7;

  *{box-sizing:border-box;}

  .auth-wrap{min-height:100vh;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:30px;}

  .auth-ok{background:var(--green-bg);color:var(--green);font-size:12px;padding:8px 10px;border-radius:7px;margin-bottom:12px;}
  .auth-note{background:var(--blue-bg);color:var(--blue);font-size:11.5px;padding:9px 11px;border-radius:7px;margin-bottom:16px;line-height:1.5;}

  .setup-screen{min-height:100vh;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:30px;}
  .setup-card{background:var(--paper);border-radius:12px;padding:30px 32px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);font-size:13.5px;line-height:1.7;}
  .setup-card h2{font-family:'Fraunces',serif;color:var(--navy);margin-top:0;}
  .setup-card code{background:var(--paper-2);padding:2px 6px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:12px;}

  .side{width:230px;flex-shrink:0;background:var(--navy);color:#EDE7D6;display:flex;flex-direction:column;padding:22px 16px;}
  .brand{display:flex;align-items:flex-start;gap:10px;margin-bottom:26px;padding:0 4px;}
  .brand-star{font-size:20px;color:var(--gold);line-height:1;margin-top:2px;}
  .brand-text h1{font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;margin:0;line-height:1.25;color:#fff;}
  .brand-text span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#B9C3D6;}
  nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
  .navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:transparent;border:none;color:#CBD4E3;font-family:'Inter';font-size:13.5px;font-weight:500;text-align:left;cursor:pointer;position:relative;}

  .navbtn.active{background:var(--navy-2);color:#fff;}
  .navbtn .ic{width:16px;text-align:center;opacity:.85;font-size:14px;}
  .navbtn .navbadge{margin-left:auto;background:var(--gold);color:var(--navy);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:10px;}

  .conn-status.conn-warn{color:#F0D9A6;}
  .conn-status.conn-ok{color:#B9E0C6;}

  .topline{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .topline h2{font-family:'Fraunces',serif;font-size:24px;margin:0 0 4px;font-weight:600;color:var(--navy);}
  .topline p{margin:0;color:var(--ink-soft);font-size:13px;}
  .topline-actions{display:flex;gap:8px;align-items:center;}
  .btn{font-family:'Inter';font-size:13px;font-weight:600;padding:9px 15px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;}

  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent;color:var(--navy);}
  .btn.ghost:hover{background:rgba(19,35,64,.06);}
  .btn.small{padding:5px 10px;font-size:12px;border-radius:6px;}
  .btn.danger{background:var(--red);border-color:var(--red);}
  .btn.danger.ghost{background:transparent;color:var(--red);border-color:var(--red);}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  .stat{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
  .stat .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);font-weight:600;}
  .stat .value{font-family:'Fraunces',serif;font-size:22px;color:var(--navy);margin-top:4px;font-weight:600;}
  .stat .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;font-family:'IBM Plex Mono',monospace;}

  .panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px;}
  .panel h3{font-family:'Fraunces',serif;font-size:15.5px;margin:0 0 12px;color:var(--navy);font-weight:600;}

  .bar-pct{width:70px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);flex-shrink:0;}

  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:8px 8px;font-weight:600;white-space:nowrap;}

  tbody tr:hover{background:var(--paper-2);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .tright{text-align:right;}
  .tcenter{text-align:center;}
  .muted{color:var(--ink-soft);}

  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.02em;}
  .badge.paid{background:var(--green-bg);color:var(--green);}
  .badge.partial{background:var(--amber-bg);color:var(--amber);}
  .badge.outstanding{background:var(--red-bg);color:var(--red);}
  .badge.inactive{background:#EAEAEA;color:#888;}
  .badge.pending{background:var(--blue-bg);color:var(--blue);}
  .badge.rejected{background:var(--red-bg);color:var(--red);}
  .badge.deleted{background:#EAEAEA;color:#777;}
  .badge.role{background:var(--paper-2);color:var(--navy);text-transform:uppercase;font-size:10px;}

  .stamp.paid{color:var(--green);}
  .stamp.partial{color:var(--amber);}
  .stamp.outstanding{color:var(--red);}

  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  select, input[type=text], input[type=number], input[type=date], input[type=password], input[type=email], textarea{
    font-family:'Inter';font-size:12.8px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);

  textarea{width:100%;resize:vertical;min-height:64px;font-family:'Inter';}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .search{flex:1;min-width:160px;}

  .tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line);}
  .tab{padding:9px 14px;font-size:12.8px;font-weight:600;color:var(--ink-soft);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty .big{font-size:34px;margin-bottom:8px;}
  .empty h4{font-family:'Fraunces',serif;color:var(--navy);margin:6px 0 4px;font-size:16px;}

  .overlay{position:fixed;inset:0;background:rgba(19,23,35,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:12px;padding:22px 24px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;}
  .modal.wide{max-width:960px;}
  .modal table{width:100%;border-collapse:collapse;font-size:12px;}
  .modal table th, .modal table td{padding:5px 6px;}
  .modal table input{width:56px;text-align:center;padding:4px;font-size:12px;}
  .modal table input.wide-input{width:100px;text-align:left;}
  .modal h3{font-family:'Fraunces',serif;margin:0 0 4px;color:var(--navy);font-size:17px;}
  .modal .mhint{font-size:11.5px;color:var(--ink-soft);margin:0 0 16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .field input, .field select, .field textarea{width:100%;}
  .field2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .close-x{position:absolute;top:16px;right:18px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);z-index:99;font-weight:500;}
  .school-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
  .school-info-grid .field{margin-bottom:0;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#CDBFA0;border-radius:5px;}

  @media(max-width:800px){
    .app{flex-direction:column;}
    .side{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px;}
    .brand{margin-bottom:0;margin-right:auto;}
    nav{flex-direction:row;flex-wrap:wrap;}
    .side-foot{display:none;}
    .stat-row{grid-template-columns:1fr 1fr;}
    .school-info-grid{grid-template-columns:1fr;}
  }
  #printSheet{display:none;}
  .ps-page{width:100%;max-width:760px;margin:0 auto;font-family:'Inter',sans-serif;color:#111;}
  .ps-head{text-align:center;border-bottom:2px solid #132340;padding-bottom:10px;margin-bottom:14px;}
  .ps-head h1{font-family:'Fraunces',serif;font-size:20px;margin:0 0 2px;}
  .ps-head div{font-size:12px;color:#444;}
  .ps-title{text-align:center;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;margin-bottom:14px;}
  .ps-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;font-size:12.5px;margin-bottom:14px;}
  .ps-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:10px;}
  .ps-table th,.ps-table td{border:1px solid #999;padding:4px 6px;}
  .ps-table th{background:#eee;}
  .ps-foot{margin-top:26px;display:flex;justify-content:space-between;font-size:12px;}
  .ps-sig{border-top:1px solid #333;padding-top:4px;width:180px;text-align:center;}
  .ps-receipt{max-width:520px;border:1.5px solid #132340;padding:20px 24px;}
  .ps-receipt-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px dashed #999;padding-bottom:10px;margin-bottom:14px;}
  .ps-receipt-no{text-align:right;font-size:12px;}
  .ps-receipt-no b{display:block;font-size:15px;color:#132340;letter-spacing:.03em;}
  .ps-receipt-status{display:inline-block;margin-top:4px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#1a7a3c;border:1px solid #1a7a3c;border-radius:3px;padding:1px 6px;}
  .ps-receipt-status.off{color:#a15c00;border-color:#a15c00;}
  .ps-amount-box{margin:16px 0;padding:12px 14px;background:#f4f6f9;border:1px solid #ccc;border-radius:6px;}
  .ps-amount-box .amt{font-size:24px;font-weight:700;color:#132340;}
  .ps-words{font-size:11.5px;color:#555;font-style:italic;margin-top:4px;}
  .ps-receipt .ps-meta{grid-template-columns:1fr;gap:5px;}
  @media print{
    body > *:not(#printSheet){display:none!important;}
    #printSheet{display:block!important;}
    @page{margin:14mm;}
  }
</style>

function computeTax(gross){
  const g = Number(gross)||0;
  let tax = 0;
  (STATE.taxBrackets||[]).forEach(b=>{
    const lo = Number(b.min)||0;
    const hi = (b.max===null || b.max===undefined || b.max==='') ? Infinity : Number(b.max);
    if(g>lo){ const amountInBracket = Math.min(g,hi)-lo; if(amountInBracket>0) tax += amountInBracket * (Number(b.rate)||0)/100; }
  });
  return Math.round(tax*100)/100;
}

/* ============================= OFFLINE CACHE + SYNC ============================= */
const IDB = window.idbKeyval;
async function cacheSnapshot(){
  if(!IDB) return;
  try{
    await IDB.setMany([
      ['cache_students', STATE.students], ['cache_fees', STATE.fees], ['cache_schoolInfo', STATE.schoolInfo],
      ['cache_log', STATE.log], ['cache_currentUser', STATE.currentUser], ['cache_receiptCounter', STATE.receiptCounter],
      ['cache_savedAt', new Date().toISOString()],
    ]);
  }catch(e){ /* storage unavailable — offline mode just won't have a cache yet */ }
}
async function loadSnapshot(){
  if(!IDB) return false;
  try{
    const cu = await IDB.get('cache_currentUser');
    if(!cu) return false;
    STATE.currentUser = cu;
    STATE.students = (await IDB.get('cache_students')) || [];
    STATE.fees = (await IDB.get('cache_fees')) || JSON.parse(JSON.stringify(DEFAULT_FEES));
    STATE.schoolInfo = (await IDB.get('cache_schoolInfo')) || {...DEFAULT_SCHOOL_INFO};
    STATE.log = (await IDB.get('cache_log')) || [];
    STATE.receiptCounter = (await IDB.get('cache_receiptCounter')) || 1;
    STATE.cacheSavedAt = await IDB.get('cache_savedAt');
    return true;
  }catch(e){ return false; }
}
async function queueOfflinePayment(entry){
  if(!IDB) return;
  const q = (await IDB.get('outbox_payments')) || [];
  q.push(entry);
  await IDB.set('outbox_payments', q);
  STATE.outboxCount = q.length;
}
async function getOutbox(){ if(!IDB) return []; return (await IDB.get('outbox_payments')) || []; }
async function clearOutboxItem(logId){
  if(!IDB) return;
  let q = await getOutbox();
  q = q.filter(e=>e.logId!==logId);
  await IDB.set('outbox_payments', q);
  STATE.outboxCount = q.length;
}
async function syncOutbox(){
  if(!navigator.onLine || !sb) return;
  const queue = await getOutbox();
  if(queue.length===0) return;
  let successCount = 0;
  for(const entry of queue){
    try{
      const {error} = await sb.from('payment_log').insert(logToRow(entry));
      if(!error){ await clearOutboxItem(entry.logId); successCount++; }
    }catch(e){ /* still offline or a transient error — leave it queued, try again next time */ }
  }
  if(successCount>0){
    toast(`${successCount} offline payment${successCount>1?'s':''} synced`);
    try{ await loadAllData(); }catch(e){}
    render();
  }
}

    if(!gotCache){ STATE.authError = 'You appear to be offline and no saved data was found on this device yet. Connect to the internet once first, then it will work offline afterward.'; }
    render();
    window.addEventListener('online', async ()=>{ toast('Back online — syncing…'); await initAuth(); }, {once:true});
    return;
  }
  window.addEventListener('online', async ()=>{ toast('Back online — syncing…'); await syncOutbox(); render(); });
  window.addEventListener('offline', ()=> render());
  const {data:{session}} = await sb.auth.getSession();
  if(session){ await loadProfileAndData(session.user); }

    }

  STATE.users = (profilesRes.data||[]).map(r=>({id:r.id, fullName:r.full_name, role:r.role, createdAt:r.created_at}));
  if(can('manageGrades')){
    const {data:gradesData} = await sb.from('grades').select('*').eq('academic_year_id', ayId).order('subject');
    STATE.grades = (gradesData||[]).map(gradeFromRow);

  if(can('manageTeachers')){

      sb.from('teachers').select('*').order('name'),

/* ============================= FINANCE LOGIC ============================= */
function calcDue(feeRow){
  const f = feeRow || {};
  let s1Base = 0, s2Base = 0;
  CATEGORIES.forEach(cat=>{ s1Base += Number(f[cat+'S1'])||0; s2Base += Number(f[cat+'S2'])||0; });
  return {s1Base, s2Base};
}
function calcFinance(student){
  const feeRow = STATE.fees[student.classCode] || DEFAULT_FEES[student.classCode];
  const {s1Base, s2Base} = calcDue(feeRow);
  const s1Paid = Number(student.s1Paid)||0;
  const s2Paid = Number(student.s2Paid)||0;
  const s1Bal = Math.max(0, s1Base - s1Paid);
  const overpay = Math.max(0, s1Paid - s1Base);
  const s2Due = Math.max(0, s2Base - overpay);
  const s2Bal = Math.max(0, s2Due - s2Paid);
  const priorOriginal = Math.max(0, Number(student.carriedForwardOriginal)||0);
  const priorBal = Math.max(0, Number(student.carriedForwardBalance)||0);
  let status;
  if(s1Bal===0 && s2Bal===0 && priorBal===0) status='paid';
  else if(s1Paid>0 || s2Paid>0 || priorBal<priorOriginal) status='partial';
  else status='outstanding';
  return {s1Due:s1Base, s1Paid, s1Bal, s2Due, s2Paid, s2Bal, priorOriginal, priorBal, status,
    totalDue:s1Base+s2Base+priorOriginal, totalPaid:s1Paid+s2Paid+(priorOriginal-priorBal), totalBal:s1Bal+s2Bal+priorBal};
}
function fmt(n){ return 'L$' + (Math.round((n||0)*100)/100).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2}); }
function fmtDT(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) + ' ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
function nextStudentId(classCode){
  const nums = STATE.students.filter(s=>s.classCode===classCode).map(s=>{ const m=s.id.match(/-(\d+)$/); return m?parseInt(m[1],10):0; });
  const next = (nums.length? Math.max(...nums):0) + 1;
  return `SCH-${classCode}-${String(next).padStart(3,'0')}`;
}
function pendingAmountFor(studentId){
  return STATE.log.filter(l=>l.studentId===studentId && l.status==='pending').reduce((a,l)=>a+l.amount,0);
}

/* ============================= AUTH SCREENS ============================= */
function renderAuth(){
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      <div class="auth-brand"><span class="star">★</span><h1>${esc(STATE.schoolInfo.name)||'School Fee Ledger'}</h1></div>
      <p class="sub">Sign in to continue, or create an account.</p>
      <div class="auth-tabs">
        <button class="auth-tab ${STATE.authMode==='login'?'active':''}" data-mode="login">Sign In</button>
        <button class="auth-tab ${STATE.authMode==='signup'?'active':''}" data-mode="signup">Create Account</button>
      </div>
      ${STATE.authError? `<div class="auth-err">${esc(STATE.authError)}</div>`:''}
      ${STATE.authOk? `<div class="auth-ok">${esc(STATE.authOk)}</div>`:''}
      ${STATE.authMode==='signup' ? `
        <div class="auth-note">New accounts start as <strong>Viewer</strong> (read-only). Ask an Admin to promote you to Bursar or Admin from the Users page once you've signed up.</div>
        <div class="field"><label>Full Name</label><input type="text" id="suName"></div>
        <div class="field"><label>Email</label><input type="email" id="suEmail"></div>
        <div class="field"><label>Password</label><input type="password" id="suPass" placeholder="At least 6 characters"></div>
        <button class="btn gold" style="width:100%;" id="suSubmit">Create Account</button>
      ` : `
        <div class="field"><label>Email</label><input type="email" id="liEmail"></div>
        <div class="field"><label>Password</label><input type="password" id="liPass"></div>
        <button class="btn gold" style="width:100%;" id="liSubmit">Sign In</button>
      `}
    </div></div>`;
  root.querySelectorAll('[data-mode]').forEach(b=> b.onclick = ()=>{ STATE.authMode=b.dataset.mode; STATE.authError=''; STATE.authOk=''; renderAuth(); });
  if(STATE.authMode==='signup'){
    document.getElementById('suSubmit').onclick = ()=>{
      const name = document.getElementById('suName').value.trim();
      const email = document.getElementById('suEmail').value.trim();
      const pass = document.getElementById('suPass').value;
      if(!name||!email||!pass){ STATE.authError='Please fill in every field.'; renderAuth(); return; }
      if(pass.length<6){ STATE.authError='Password must be at least 6 characters.'; renderAuth(); return; }
      doSignup(name, email, pass);
    };
  } else {
    const doIt = ()=>{
      const email = document.getElementById('liEmail').value.trim();
      const pass = document.getElementById('liPass').value;
      if(!email||!pass){ STATE.authError='Please enter your email and password.'; renderAuth(); return; }
      doLogin(email, pass);
    };
    document.getElementById('liSubmit').onclick = doIt;
    document.getElementById('liPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doIt(); });
  }
}

/* ============================= RENDER: SHELL ============================= */
function render(){
  const root = document.getElementById('root');
  if(!CONFIGURED){ renderSetupRequired(); return; }
  if(!STATE.loaded){ root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#5B5F6A;">Loading ledger…</div>`; return; }
  if(!STATE.currentUser){ renderAuth(); return; }

  root.innerHTML = `<div class="app" id="appRoot"></div>`;
  const app = document.getElementById('appRoot');

  const pendingCount = STATE.log.filter(l=>l.status==='pending').length;
  const pendingExpCount = STATE.expenditures.filter(x=>x.status==='pending').length;
  const navItems = [
    ['dashboard','◆','Dashboard', null],
    can('editFees') ? ['fees','₤','Fee Structure', null] : null,
    ['students','☰','Students', null],
    (can('approvePayments')||can('submitPayment')) ? ['approvals','⏳','Approvals', pendingCount||null] : null,
    ['log','✎','Payment Log', null],
    (can('submitExpenditure')||can('approveExpenditures')) ? ['expenditures','⛁','Expenditures', pendingExpCount||null] : null,
    can('manageGrades') ? ['grades','◈','Grades', null] : null,
    can('manageTeachers') ? ['teachers','🎓','Teachers', null] : null,
    can('manageUsers') ? ['users','◍','Users', null] : null,
  ].filter(Boolean);

  app.innerHTML = `
    <div class="side">
      <div class="brand">
        <div class="brand-star">★</div>
        <div class="brand-text"><h1>${esc(STATE.schoolInfo.name) || 'Your School Name'}</h1><span>Fee Ledger · LRD</span></div>
      </div>
      <nav>
        ${navItems.map(([id,ic,label,badgeN])=>`
          <button class="navbtn ${STATE.view===id?'active':''}" data-nav="${id}">
            <span class="ic">${ic}</span>${label}${badgeN? `<span class="navbadge">${badgeN}</span>`:''}
          </button>`).join('')}
      </nav>
      <div class="side-foot">
        <div class="who">${esc(STATE.currentUser.fullName)}</div>
        <div class="role">${esc(ROLES[STATE.currentUser.role].label)}</div>
        <div class="yr">AY ${esc(STATE.currentAcademicYearLabel||STATE.schoolInfo.year)}</div>
        ${navigator.onLine
          ? (STATE.outboxCount>0
              ? `<div class="conn-status conn-warn">🟡 Online — ${STATE.outboxCount} payment${STATE.outboxCount>1?'s':''} syncing…</div>`
              : `<div class="conn-status conn-ok">🟢 Online${STATE.offlineBoot?' — synced':''}</div>`)
          : `<div class="conn-status conn-off">🔴 Offline${STATE.outboxCount>0? ` — ${STATE.outboxCount} payment${STATE.outboxCount>1?'s':''} queued`:''}</div>`}
        <button data-action="settings">School Info</button>
        ${STATE.currentUser.role==='admin'? `<button data-action="academicyear">Academic Year</button>`:''}
        <button data-action="logout">Log Out</button>
      </div>
    </div>
    <div class="main" id="mainArea"></div>
  `;
  app.querySelectorAll('[data-nav]').forEach(b=>{ b.onclick = ()=>{ STATE.view=b.dataset.nav; render(); }; });
  app.querySelector('[data-action="settings"]').onclick = openSchoolInfoModal;
  const ayBtn = app.querySelector('[data-action="academicyear"]'); if(ayBtn) ayBtn.onclick = openAcademicYearModal;
  app.querySelector('[data-action="logout"]').onclick = logout;

  const main = document.getElementById('mainArea');
  if(STATE.view==='dashboard') renderDashboard(main);
  else if(STATE.view==='fees' && can('editFees')) renderFees(main);
  else if(STATE.view==='students') renderStudents(main);
  else if(STATE.view==='approvals' && (can('approvePayments')||can('submitPayment'))) renderApprovals(main);
  else if(STATE.view==='log') renderLog(main);
  else if(STATE.view==='expenditures' && (can('submitExpenditure')||can('approveExpenditures'))) renderExpenditures(main);
  else if(STATE.view==='grades' && can('manageGrades')) renderGrades(main);
  else if(STATE.view==='teachers' && can('manageTeachers')) renderTeachers(main);
  else if(STATE.view==='users' && can('manageUsers')) renderUsers(main);
  else { STATE.view='dashboard'; renderDashboard(main); }
}

/* ============================= DASHBOARD ============================= */
function renderDashboard(main){
  const selClass = STATE.dashboardClass;
  const scoped = selClass==='ALL' ? STATE.students : STATE.students.filter(s=>s.classCode===selClass);
  const finances = scoped.map(calcFinance);
  const totalStudents = scoped.length;
  const activeStudents = scoped.filter(s=>s.status!=='Inactive').length;
  const totalCollected = finances.reduce((a,f)=>a+f.totalPaid,0);
  const totalOutstanding = finances.reduce((a,f)=>a+f.totalBal,0);
  const totalExpected = finances.reduce((a,f)=>a+f.totalDue,0);
  const fullyPaid = finances.filter(f=>f.status==='paid').length;
  const pendingCount = STATE.log.filter(l=>l.status==='pending' && (selClass==='ALL'||l.classCode===selClass)).length;
  const pendingSum = STATE.log.filter(l=>l.status==='pending' && (selClass==='ALL'||l.classCode===selClass)).reduce((a,l)=>a+l.amount,0);

  const byClass = CLASS_DEFS.map(c=>{
    const list = STATE.students.filter(s=>s.classCode===c.code);
    const fin = list.map(calcFinance);
    const due = fin.reduce((a,f)=>a+f.totalDue,0), paid = fin.reduce((a,f)=>a+f.totalPaid,0);
    return {...c, count:list.length, due, paid, pct: due>0? Math.round(paid/due*100):0};
  }).filter(c=>c.count>0);

  const recentPosted = STATE.log.filter(l=>l.status==='approved' && (selClass==='ALL'||l.classCode===selClass));

  main.innerHTML = `
    <div class="topline">
      <div><h2>Dashboard</h2><p>${esc(STATE.schoolInfo.name)||'School'} · ${esc(STATE.schoolInfo.county)||'County'} · Academic Year ${esc(STATE.schoolInfo.year)}</p></div>
      <div class="topline-actions">
        <select id="dashClass">
          <option value="ALL" ${selClass==='ALL'?'selected':''}>All classes</option>
          ${CLASS_DEFS.map(c=>`<option value="${c.code}" ${selClass===c.code?'selected':''}>${esc(c.label)}</option>`).join('')}
        </select>
        ${can('manageStudents')? `<button class="btn" data-action="add-student">+ Add Student</button>`:''}
      </div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="label">${selClass==='ALL'?'Total Students':'Students in class'}</div><div class="value">${totalStudents}</div><div class="sub">${activeStudents} active</div></div>
      <div class="stat"><div class="label">Collected (posted)</div><div class="value" style="color:var(--green)">${fmt(totalCollected)}</div><div class="sub">of ${fmt(totalExpected)} expected</div></div>
      <div class="stat"><div class="label">Outstanding</div><div class="value" style="color:var(--red)">${fmt(totalOutstanding)}</div><div class="sub">${selClass==='ALL'?'across all classes':CLASS_LABEL[selClass]}</div></div>
      <div class="stat"><div class="label">Awaiting Approval</div><div class="value" style="color:var(--blue)">${pendingCount}</div><div class="sub">${fmt(pendingSum)} pending review</div></div>
    </div>
    ${selClass==='ALL' ? `
    <div class="panel" style="overflow-x:auto;"><h3>Total to collect — by class</h3>
      ${byClass.length===0? `<p class="muted" style="font-size:13px;">No students enrolled yet.</p>` : `
      <table><thead><tr><th>Class</th><th class="tright">Students</th><th class="tright">Total Due</th><th class="tright">Total Collected</th><th class="tright">Balance</th><th class="tright">% Collected</th></tr></thead>
        <tbody>${byClass.map(c=>`<tr><td><strong>${esc(c.label)}</strong></td><td class="tright">${c.count}</td><td class="tright mono">${fmt(c.due)}</td><td class="tright mono" style="color:var(--green)">${fmt(c.paid)}</td><td class="tright mono" style="color:var(--red)">${fmt(c.due-c.paid)}</td><td class="tright">${c.pct}%</td></tr>`).join('')}
        <tr style="border-top:2px solid var(--line);font-weight:700;"><td>Total — all classes</td><td class="tright">${byClass.reduce((a,c)=>a+c.count,0)}</td><td class="tright mono">${fmt(byClass.reduce((a,c)=>a+c.due,0))}</td><td class="tright mono" style="color:var(--green)">${fmt(byClass.reduce((a,c)=>a+c.paid,0))}</td><td class="tright mono" style="color:var(--red)">${fmt(byClass.reduce((a,c)=>a+c.due-c.paid,0))}</td><td class="tright">${byClass.reduce((a,c)=>a+c.due,0)>0? Math.round(byClass.reduce((a,c)=>a+c.paid,0)/byClass.reduce((a,c)=>a+c.due,0)*100):0}%</td></tr>
        </tbody></table>`}
    </div>` : `
    <div class="panel" style="overflow-x:auto;"><h3>${esc(CLASS_LABEL[selClass])} — student balances</h3>
      ${scoped.length===0? `<p class="muted" style="font-size:13px;">No students in this class yet.</p>` : `
      <table><thead><tr><th>ID</th><th>Name</th><th class="tright">S1 Bal</th><th class="tright">S2 Bal</th><th>Status</th></tr></thead>
        <tbody>${scoped.slice().sort((a,b)=> calcFinance(b).totalBal - calcFinance(a).totalBal).map(s=>{
          const fin = calcFinance(s);
          return `<tr><td class="mono">${esc(s.id)}</td><td>${esc(s.name)}</td><td class="tright mono">${fmt(fin.s1Bal)}</td><td class="tright mono">${fmt(fin.s2Bal)}</td><td>${badge(fin.status)}</td></tr>`;
        }).join('')}</tbody></table>`}
    </div>`}
    <div class="panel"><h3>Recent posted payments</h3>
      ${recentPosted.length===0? `<p class="muted" style="font-size:13px;">No approved payments yet.</p>` : `
      <table><thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Sem.</th><th class="tright">Amount</th><th>Receipt</th></tr></thead>
        <tbody>${[...recentPosted].slice(-6).reverse().map(l=>`
          <tr><td class="mono">${esc(l.date)}</td><td>${esc(l.name)||esc(l.studentId)}</td><td class="muted">${esc(CLASS_LABEL[l.classCode]||l.classCode)}</td><td>S${l.semester}</td><td class="tright mono">${fmt(l.amount)}</td><td class="mono muted">${esc(l.receipt)||'—'}</td></tr>`).join('')}
        </tbody></table>`}
    </div>
    ${(can('submitExpenditure')||can('approveExpenditures')) ? (()=>{
      const allFin = STATE.students.map(calcFinance);
      const allCollected = allFin.reduce((a,f)=>a+f.totalPaid,0);
      const allSpent = STATE.expenditures.filter(x=>x.status==='approved').reduce((a,x)=>a+x.amount,0);
      const net = allCollected - allSpent;
      return `
    <div class="panel"><h3>Collections vs. Expenditures — all classes, ${esc(STATE.currentAcademicYearLabel||STATE.schoolInfo.year)}</h3>
      <div class="stat-row">
        <div class="stat"><div class="label">Total Collected</div><div class="value" style="color:var(--green)">${fmt(allCollected)}</div></div>
        <div class="stat"><div class="label">Total Expenditure</div><div class="value" style="color:var(--red)">${fmt(allSpent)}</div></div>
        <div class="stat"><div class="label">Net</div><div class="value" style="color:${net>=0?'var(--green)':'var(--red)'}">${fmt(net)}</div></div>
      </div>
    </div>`;
    })() : ''}
  `;
  main.querySelector('#dashClass').onchange = e=>{ STATE.dashboardClass = e.target.value; render(); };
  const addBtn = main.querySelector('[data-action="add-student"]');
  if(addBtn) addBtn.onclick = ()=>openStudentModal(null);
}

/* ============================= FEE STRUCTURE ============================= */
function renderFees(main){
  main.innerHTML = `
    <div class="topline"><div><h2>Fee Structure</h2><p>Every fee category has its own Semester 1 and Semester 2 amount. Amounts in LRD.</p></div></div>
    <div class="panel" style="overflow-x:auto;">
      <table><thead>
        <tr><th rowspan="2" style="vertical-align:bottom;">Class</th><th colspan="${CATEGORIES.length}" class="tcenter" style="border-bottom:2px solid var(--navy);">Semester 1</th><th colspan="${CATEGORIES.length}" class="tcenter" style="border-bottom:2px solid var(--navy);">Semester 2</th><th rowspan="2" class="tright" style="vertical-align:bottom;">S1 Total</th><th rowspan="2" class="tright" style="vertical-align:bottom;">S2 Total</th><th rowspan="2" class="tright" style="vertical-align:bottom;">Overall</th></tr>
        <tr>${CATEGORIES.map(cat=>`<th class="tright">${CATEGORY_LABELS[cat]}</th>`).join('')}${CATEGORIES.map(cat=>`<th class="tright">${CATEGORY_LABELS[cat]}</th>`).join('')}</tr>
      </thead>
        <tbody>${CLASS_DEFS.map(c=>{
          const f = STATE.fees[c.code]; const {s1Base, s2Base} = calcDue(f);
          return `<tr><td><strong>${esc(c.label)}</strong></td>
            ${CATEGORIES.map(cat=>`<td class="tright"><input type="number" min="0" data-fee="${c.code}" data-field="${cat}S1" value="${f[cat+'S1']||0}" style="width:64px;text-align:right;"></td>`).join('')}
            ${CATEGORIES.map(cat=>`<td class="tright"><input type="number" min="0" data-fee="${c.code}" data-field="${cat}S2" value="${f[cat+'S2']||0}" style="width:64px;text-align:right;"></td>`).join('')}
            <td class="tright mono" style="font-weight:600;">${fmt(s1Base)}</td><td class="tright mono" style="font-weight:600;">${fmt(s2Base)}</td><td class="tright mono" style="font-weight:700;color:var(--navy);">${fmt(s1Base+s2Base)}</td></tr>`;
        }).join('')}
        </tbody>
        <tfoot>${(()=>{
          let sumS1=0, sumS2=0;
          CLASS_DEFS.forEach(c=>{ const d=calcDue(STATE.fees[c.code]); sumS1+=d.s1Base; sumS2+=d.s2Base; });
          return `<tr style="border-top:2px solid var(--navy);font-weight:700;"><td colspan="${1+CATEGORIES.length*2}">Total collectible — all classes</td><td class="tright mono">${fmt(sumS1)}</td><td class="tright mono">${fmt(sumS2)}</td><td class="tright mono">${fmt(sumS1+sumS2)}</td></tr>`;
        })()}</tfoot>
      </table>
    </div>
    <p class="muted" style="font-size:12px;">Each category (Registration, PTA, Breakage, ID Card, etc.) now has an independent Semester 1 amount and Semester 2 amount — leave Semester 2 at 0 for anything only charged once. Overpayment in Semester 1 is automatically credited toward Semester 2.</p>
  `;
  main.querySelectorAll('[data-fee]').forEach(inp=>{
    inp.onchange = async ()=>{
      const code = inp.dataset.fee, field = inp.dataset.field;
      STATE.fees[code][field] = Number(inp.value)||0;
      const {error} = await sb.from('school_config').update({fees:STATE.fees}).eq('school_id', STATE.currentUser.schoolId);
      if(error){ toast('Error saving: '+error.message); return; }
      render(); toast('Fee structure updated');
    };
  });
}

/* ============================= STUDENTS ============================= */
function renderStudents(main){
  const f = STATE.studentsFilter;

async function approvePayment(logId){
  const l = STATE.log.find(x=>x.logId===logId);
  if(!l || l.status!=='pending') return;
  const student = STATE.students.find(s=>s.id===l.studentId);
  if(!student){ toast('Student record not found'); return; }
  if(l.semester==='prior'){
    student.carriedForwardBalance = Math.max(0, (Number(student.carriedForwardBalance)||0) - l.amount);
  } else {
    student['s'+l.semester+'Paid'] = (Number(student['s'+l.semester+'Paid'])||0) + l.amount;
    student['s'+l.semester+'Date'] = l.date;
    student['s'+l.semester+'Receipt'] = l.receipt;
  }
  l.status='approved'; l.reviewedBy=STATE.currentUser.id; l.reviewedByName=STATE.currentUser.fullName; l.reviewedAt=new Date().toISOString();

  const {error:e1} = student.enrollmentId
    ? await sb.from('enrollments').update(enrollmentToRow(student, STATE.currentAcademicYearId)).eq('id', student.enrollmentId)
    : await sb.from('students').update(studentToRow(student)).eq('id', student.id);
  const {error:e2} = await sb.from('payment_log').update(logToRow(l)).eq('log_id', logId);
  if(e1||e2){ toast('Error approving payment: '+((e1||e2).message)); await refreshStudentsAndLog(); render(); return; }
  render();
  toast(`Approved — ${fmt(l.amount)} posted to ${l.name||l.studentId}`);
}
function rejectPayment(logId){
  const l = STATE.log.find(x=>x.logId===logId);
  if(!l || l.status!=='pending') return;
  openReasonModal('Reject Payment', `${l.name||l.studentId} · ${fmt(l.amount)} · S${l.semester}. This will not post to the student balance.`, 'Reject Payment', async (reason)=>{
    l.status='rejected'; l.reviewedBy=STATE.currentUser.id; l.reviewedByName=STATE.currentUser.fullName; l.reviewedAt=new Date().toISOString(); l.reviewNote=reason;
    const {error} = await sb.from('payment_log').update(logToRow(l)).eq('log_id', logId);
    if(error){ toast('Error: '+error.message); await refreshStudentsAndLog(); }
    closeModal(); render(); toast('Payment rejected');
  });
}

function exportLogCSV(){
  const rows = [['Status','Date','Student ID','Name','Class','Semester','Amount (LRD)','Method','Receipt','Submitted By','Reviewed/Deleted By','Note']];
  STATE.log.forEach(l=> rows.push([l.status, l.date, l.studentId, l.name, CLASS_LABEL[l.classCode]||l.classCode, 'S'+l.semester, l.amount, l.method||'', l.receipt||'', l.submittedByName||'', l.reviewedByName||l.deletedByName||'', l.reviewNote||l.deleteNote||'']));
  const csv = rows.map(r=> r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'payment_log.csv'; a.click();
}
function deletePostedPayment(logId){
  const l = STATE.log.find(x=>x.logId===logId);
  if(!l || l.status!=='approved') return;
  openReasonModal('Delete Posted Payment', `${l.name||l.studentId} · ${fmt(l.amount)} · ${l.semester==='prior'?'Prior Balance':'S'+l.semester}, posted ${fmtDT(l.reviewedAt)}. This reduces the student's paid amount and moves the entry to the Audit Trail with your note attached — it is never fully erased.`, 'Delete Payment', async (reason)=>{
    const student = STATE.students.find(s=>s.id===l.studentId);
    if(student){
      if(l.semester==='prior'){
        student.carriedForwardBalance = Math.min(student.carriedForwardOriginal||0, (Number(student.carriedForwardBalance)||0) + l.amount);
      } else {
        const key='s'+l.semester+'Paid'; student[key] = Math.max(0, (Number(student[key])||0) - l.amount);
      }
    }
    l.status='deleted'; l.deletedBy=STATE.currentUser.id; l.deletedByName=STATE.currentUser.fullName; l.deletedAt=new Date().toISOString(); l.deleteNote=reason;
    const ops = [ sb.from('payment_log').update(logToRow(l)).eq('log_id', logId) ];
    if(student) ops.push(student.enrollmentId
      ? sb.from('enrollments').update(enrollmentToRow(student, STATE.currentAcademicYearId)).eq('id', student.enrollmentId)
      : sb.from('students').update(studentToRow(student)).eq('id', student.id));
    const results = await Promise.all(ops);
    if(results.some(r=>r.error)){ toast('Error deleting payment'); await refreshStudentsAndLog(); }
    closeModal(); render(); toast('Payment deleted — recorded in the audit trail');
  });
}

async function addExpenditureCategory(name){
  STATE.expenditureCategories = [...STATE.expenditureCategories, name];
  const {error} = await sb.from('school_config').update({expenditure_categories:STATE.expenditureCategories}).eq('school_id', STATE.currentUser.schoolId);
  if(error){ toast('Error saving: '+error.message); return; }
  render(); toast('Category added');

async function removeExpenditureCategory(idx){
  const removed = STATE.expenditureCategories[idx];
  const inUse = STATE.expenditures.some(x=>x.category===removed && x.status!=='deleted');
  if(inUse){ toast('Can\'t remove — this category is used by an existing expenditure record'); return; }
  STATE.expenditureCategories = STATE.expenditureCategories.filter((c,i)=>i!==idx);
  const {error} = await sb.from('school_config').update({expenditure_categories:STATE.expenditureCategories}).eq('school_id', STATE.currentUser.schoolId);
  if(error){ toast('Error saving: '+error.message); return; }
  render(); toast('Category removed');
}

async function startNewAcademicYear(label){
  const schoolId = STATE.currentUser.schoolId;
  const oldAyId = STATE.currentAcademicYearId;
  const newAyId = 'ay_' + Date.now();

  // Freeze the outgoing year's fee structure/tax brackets for the historical record, then flip the flag.
  await sb.from('academic_years').update({fee_structure: STATE.fees, tax_brackets: STATE.taxBrackets, is_current:false}).eq('id', oldAyId);
  const {error: createErr} = await sb.from('academic_years').insert({id:newAyId, school_id:schoolId, label, is_current:true, receipt_counter: STATE.receiptCounter||1});
  if(createErr) throw createErr;

  const activeStudents = STATE.students.filter(s=>s.status==='Active');
  const rows = activeStudents.map(s=>{
    const fin = calcFinance(s);
    return {
      id: `en_${s.id}_${newAyId}`, student_id: s.id, academic_year_id: newAyId, class_code: s.classCode,
      student_type: 'Old', status: 'Active',
      s1_paid: 0, s1_date: null, s1_receipt: null, s2_paid: 0, s2_date: null, s2_receipt: null,
      carried_forward_original: fin.totalBal, carried_forward_balance: fin.totalBal,
      school_id: schoolId,
    };
  });
  if(rows.length){
    const {error: rowErr} = await sb.from('enrollments').insert(rows);
    if(rowErr) throw rowErr;
  }

  STATE.schoolInfo.year = label;
  await sb.from('school_config').update({school_info:STATE.schoolInfo}).eq('school_id', schoolId);

  STATE.currentAcademicYearId = newAyId;
  STATE.currentAcademicYearLabel = label;
  const rowById = {}; rows.forEach(r=> rowById[r.student_id]=r);
  STATE.students.forEach(s=>{
    const r = rowById[s.id];
    if(r){
      s.enrollmentId = r.id; s.s1Paid=0; s.s1Date=''; s.s1Receipt=''; s.s2Paid=0; s.s2Date=''; s.s2Receipt='';
      s.carriedForwardOriginal = r.carried_forward_original; s.carriedForwardBalance = r.carried_forward_balance;
    }
  });
  await cacheSnapshot();
}

  const s = STATE.students.find(x=>x.id===studentId);
  if(!s) return;
  const fin = calcFinance(s);
  openModal(`
    <button class="close-x" data-close>×</button>
    <h3>Record Payment</h3>
    <p class="mhint">${esc(s.name)||esc(s.id)} · ${esc(CLASS_LABEL[s.classCode])} · S1 balance ${fmt(fin.s1Bal)} · S2 balance ${fmt(fin.s2Bal)}${fin.priorOriginal>0?` · Prior balance ${fmt(fin.priorBal)}`:''}</p>

    </div>
    <div class="field2">
      <div class="field"><label>Receipt No.</label><input type="text" id="pReceipt" value="Assigned when submitted" disabled style="font-weight:700;color:var(--navy);"></div>
      <div class="field"><label>Method</label><select id="pMethod"><option>Cash</option><option>Mobile Money</option><option>Bank Transfer</option><option>Cheque</option></select></div>
    </div>
    <p class="muted" style="font-size:11.5px;margin-top:-6px;">The receipt number is assigned by the system the moment you submit, so two payments can never share a number. Write it on the physical receipt after submitting.</p>
    <div class="modal-actions"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="pSave">Submit for Approval</button></div>
  `);
  modalRoot.querySelectorAll('[data-close]').forEach(b=> b.onclick=closeModal);
  modalRoot.querySelector('#pSave').onclick = async ()=>{
    const amount = Number(modalRoot.querySelector('#pAmount').value);
    if(!amount || amount<=0){ toast('Enter a valid payment amount'); return; }
    const sem = modalRoot.querySelector('#pSem').value;
    const date = modalRoot.querySelector('#pDate').value || new Date().toISOString().slice(0,10);
    const method = modalRoot.querySelector('#pMethod').value;
    const offline = !navigator.onLine;
    const saveBtn = modalRoot.querySelector('#pSave'); saveBtn.disabled = true;
    if(offline){
      const receipt = 'OFF-'+Date.now().toString(36).toUpperCase();
      const entry = {
        logId: 'l'+Date.now()+Math.random().toString(36).slice(2,7),
        date, studentId: s.id, name: s.name, classCode: s.classCode, semester: sem, amount, method, receipt,
        status:'pending', submittedBy: STATE.currentUser.id, submittedByName: STATE.currentUser.fullName, submittedAt: new Date().toISOString(),
      };
      await queueOfflinePayment(entry);
      STATE.log.push(entry);
      await cacheSnapshot();
      closeModal(); render();
      toast(`Offline — payment queued. Receipt ${receipt}. It will sync automatically when back online.`);
      return;
    }
    try{
      // Ask the database for the next receipt number atomically — it increments
      // and returns the counter in one step, so concurrent submissions can never collide.
      const {data: counterVal, error: rpcErr} = await sb.rpc('next_receipt_number');
      if(rpcErr){ toast('Error assigning receipt number: '+rpcErr.message); saveBtn.disabled=false; return; }
      const receipt = 'RCT-' + String(counterVal).padStart(6,'0');
      const entry = {
        logId: 'l'+Date.now()+Math.random().toString(36).slice(2,7),
        date, studentId: s.id, name: s.name, classCode: s.classCode, semester: sem, amount, method, receipt,
        status:'pending', submittedBy: STATE.currentUser.id, submittedByName: STATE.currentUser.fullName, submittedAt: new Date().toISOString(),
      };
      const {error} = await sb.from('payment_log').insert(logToRow(entry));
      if(error){ toast('Error: '+error.message); saveBtn.disabled=false; return; }
      STATE.log.push(entry);
      STATE.receiptCounter = counterVal;
      await cacheSnapshot();
      closeModal(); render(); toast(`Payment of ${fmt(amount)} submitted — Receipt ${receipt}`);
    }catch(networkErr){
      const offReceipt = 'OFF-'+Date.now().toString(36).toUpperCase();
      const entry = {
        logId: 'l'+Date.now()+Math.random().toString(36).slice(2,7),
        date, studentId: s.id, name: s.name, classCode: s.classCode, semester: sem, amount, method, receipt: offReceipt,
        status:'pending', submittedBy: STATE.currentUser.id, submittedByName: STATE.currentUser.fullName, submittedAt: new Date().toISOString(),
      };
      await queueOfflinePayment(entry);
      STATE.log.push(entry);
      await cacheSnapshot();
      closeModal(); render();
      toast(`Connection lost — payment queued offline. Receipt ${offReceipt}.`);
    }
  };
}

function amountInWords(n){
  n = Math.round(Number(n)||0);
  if(n===0) return 'Zero';
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function threeDigits(num){
    let s='';
    if(num>=100){ s += ones[Math.floor(num/100)] + ' Hundred'; num%=100; if(num) s+=' '; }
    if(num>=20){ s += tens[Math.floor(num/10)]; if(num%10) s+='-'+ones[num%10]; }
    else if(num>0){ s += ones[num]; }
    return s;
  }
  const groups = [['Billion',1e9],['Million',1e6],['Thousand',1e3]];
  let remain = n, parts=[];
  for(const [label,val] of groups){
    if(remain>=val){ const g=Math.floor(remain/val); parts.push(threeDigits(g)+' '+label); remain%=val; }
  }
  if(remain>0) parts.push(threeDigits(remain));
  return parts.join(' ');
}

function renderClassRanking(main){
  const cls = STATE.rankClass || CLASS_DEFS[0].code;
  const period = STATE.rankPeriod || 'avgS1';
  const list = STATE.students.filter(s=>s.classCode===cls);
  function studentPeriodAvg(studentId, key){
    const subs = STATE.grades.filter(g=>g.studentId===studentId);
    let vals = [];
    if(key==='avgS1') vals = subs.map(g=>gradeAvg(g,'s1')).filter(v=>v!==null);
    else if(key==='avgS2') vals = subs.map(g=>gradeAvg(g,'s2')).filter(v=>v!==null);
    else if(key==='overall') vals = subs.flatMap(g=>['p1','p2','p3','examS1','p4','p5','p6','examS2'].map(k=>g[k])).filter(v=>v!==null && v!==undefined && v!=='').map(Number);
    else vals = subs.map(g=>g[key]).filter(v=>v!==null && v!==undefined && v!=='').map(Number);
    return {avg: vals.length? vals.reduce((a,v)=>a+v,0)/vals.length : null, count: vals.length};
  }
  const ranked = list.map(s=>{ const r = studentPeriodAvg(s.id, period); return {student:s, avg:r.avg, count:r.count}; })
    .filter(r=>r.avg!==null).sort((a,b)=>b.avg-a.avg);
  const noData = list.length - ranked.length;
  main.innerHTML = `
    <div class="topline"><div></div><div class="topline-actions">
      <select id="rClass">${CLASS_DEFS.map(c=>`<option value="${c.code}" ${cls===c.code?'selected':''}>${esc(c.label)}</option>`).join('')}</select>
      <select id="rPeriod">${RANK_PERIODS.map(([k,lbl])=>`<option value="${k}" ${period===k?'selected':''}>${lbl}</option>`).join('')}</select>
    </div></div>
    <div class="panel" style="overflow-x:auto;">
      ${ranked.length===0? `<p class="muted" style="font-size:13px;">No grades recorded yet for this class/period.</p>` : `
      <table><thead><tr><th>Rank</th><th>ID</th><th>Name</th><th class="tright">Average</th><th class="tright">Subjects Counted</th></tr></thead>
        <tbody>${ranked.map((r,i)=>`<tr><td><strong>${i+1}</strong></td><td class="mono">${esc(r.student.id)}</td><td>${esc(r.student.name)||'<span class="muted">(unnamed)</span>'}</td><td class="tright mono" style="font-weight:600;">${r.avg.toFixed(1)}</td><td class="tright">${r.count}</td></tr>`).join('')}</tbody></table>`}
    </div>
    ${noData>0? `<p class="muted" style="font-size:12px;">${noData} student(s) in this class have no grades recorded yet for this period and aren't ranked.</p>` : ''}
  `;
  main.querySelector('#rClass').onchange = e=>{ STATE.rankClass = e.target.value; render(); };
  main.querySelector('#rPeriod').onchange = e=>{ STATE.rankPeriod = e.target.value; render(); };
}

function openSalaryModal(teacherId){
  const t = STATE.teachers.find(x=>x.id===teacherId);
  if(!t) return;
  const month = new Date().toISOString().slice(0,7);
  let deductions = [];

  function draw(){
    const gross = Number(document.getElementById('sGross')?.value ?? t.baseSalary) || t.baseSalary;
    const tax = computeTax(gross);
    const dedTotal = deductions.reduce((a,d)=>a+(Number(d.amount)||0),0);
    const net = gross - tax - dedTotal;
    openModal(`
      <button class="close-x" data-close>×</button>
      <h3>Pay Salary — ${esc(t.name)}</h3>
      <p class="mhint">${esc(t.id)} · Base salary ${fmt(t.baseSalary)}</p>
      <div class="field2">
        <div class="field"><label>Month</label><input type="month" id="sMonth" value="${month}"></div>
        <div class="field"><label>Gross Salary (LRD)</label><input type="number" min="0" id="sGross" value="${gross}"></div>
      </div>
      <div class="note-box">Tax: ${fmt(tax)} (computed automatically from your Tax Brackets)</div>
      <div style="margin-top:12px;"><label style="font-size:11.5px;font-weight:600;color:var(--ink-soft);">Deductions / Penalties</label>
        <div id="dRows" style="margin-top:6px;">
          ${deductions.map((d,i)=>`<div class="field2" data-drow="${i}" style="grid-template-columns:2fr 1fr auto;align-items:end;">
            <div class="field"><input type="text" class="dLabel" value="${esc(d.label)}" placeholder="e.g. Lateness penalty"></div>
            <div class="field"><input type="number" min="0" class="dAmount" value="${d.amount}"></div>
            <button class="btn ghost" data-drm="${i}">✕</button>
          </div>`).join('')}
        </div>
        <button class="btn ghost" id="dAdd" style="margin-top:4px;">+ Add Deduction</button>
      </div>
      <div class="field2" style="margin-top:14px;">
        <div class="field"><label>Total Deductions</label><input type="text" value="${fmt(dedTotal)}" disabled></div>
        <div class="field"><label>Net Pay</label><input type="text" value="${fmt(net)}" disabled style="font-weight:700;color:var(--navy);"></div>
      </div>
      <div class="modal-actions"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="sSave">Post Payment</button></div>
    `);
    modalRoot.querySelectorAll('[data-close]').forEach(b=> b.onclick=closeModal);
    modalRoot.querySelector('#sGross').onchange = ()=>{ syncDeductions(); draw(); };
    modalRoot.querySelector('#dAdd').onclick = ()=>{ syncDeductions(); deductions.push({label:'', amount:0}); draw(); };
    modalRoot.querySelectorAll('[data-drm]').forEach(b=> b.onclick = ()=>{ syncDeductions(); deductions.splice(Number(b.dataset.drm),1); draw(); });
    modalRoot.querySelectorAll('.dLabel, .dAmount').forEach(inp=> inp.onchange = ()=>{ syncDeductions(); draw(); });
    modalRoot.querySelector('#sSave').onclick = async ()=>{
      syncDeductions();
      const finalGross = Number(modalRoot.querySelector('#sGross').value)||0;
      const finalMonth = modalRoot.querySelector('#sMonth').value || month;
      const finalTax = computeTax(finalGross);
      const finalDedTotal = deductions.reduce((a,d)=>a+(Number(d.amount)||0),0);
      const finalNet = finalGross - finalTax - finalDedTotal;
      const payment = {
        id: 'sal_'+Date.now()+Math.random().toString(36).slice(2,7), teacherId:t.id, teacherName:t.name, month:finalMonth,
        gross:finalGross, tax:finalTax, deductions, net:finalNet, paidDate:new Date().toISOString().slice(0,10),
        paidBy:STATE.currentUser.id, paidByName:STATE.currentUser.fullName,
      };
      const {error} = await sb.from('teacher_payments').insert(paymentToRow(payment));
      if(error){ toast('Error: '+error.message); return; }
      STATE.teacherPayments.unshift(payment);
      closeModal(); render(); toast(`Salary of ${fmt(finalNet)} posted for ${t.name}`);
    };
  }
  function syncDeductions(){
    modalRoot.querySelectorAll('#dRows [data-drow]').forEach((el,i)=>{
      deductions[i] = {label: el.querySelector('.dLabel').value, amount: Number(el.querySelector('.dAmount').value)||0};
    });
  }
  draw();
}

  main.innerHTML = `

        <tbody>${list.map(p=>{
          const dedTotal = (p.deductions||[]).reduce((a,d)=>a+(Number(d.amount)||0),0);
          return `<tr><td class="mono">${esc(p.month)}</td><td>${esc(p.teacherName)}</td><td class="tright mono">${fmt(p.gross)}</td><td class="tright mono">${fmt(p.tax)}</td><td class="tright mono">${fmt(dedTotal)}</td><td class="tright mono" style="font-weight:600;">${fmt(p.net)}</td><td class="muted">${esc(p.paidDate)}</td></tr>`;
        }).join('')}</tbody></table>`}
    </div>
  `;
}

function openTaxBracketsModal(){
  let brackets = STATE.taxBrackets.map(b=>({...b}));
  function draw(){
    openModal(`
      <button class="close-x" data-close>×</button>
      <h3>Tax Deduction Brackets</h3>
      <p class="mhint">Progressive brackets applied to gross salary. Edit these to match your actual payroll/tax policy — leave the last "Max" blank for "and above."</p>
      <div id="bRows">
        ${brackets.map((b,i)=>`<div class="field2" data-brow="${i}" style="grid-template-columns:1fr 1fr 0.8fr auto;align-items:end;">
          <div class="field"><label>${i===0?'Min (LRD)':''}</label><input type="number" min="0" class="bMin" value="${b.min}"></div>
          <div class="field"><label>${i===0?'Max (LRD)':''}</label><input type="number" min="0" class="bMax" value="${b.max===null?'':b.max}" placeholder="blank = no limit"></div>
          <div class="field"><label>${i===0?'Rate %':''}</label><input type="number" min="0" max="100" class="bRate" value="${b.rate}"></div>
          <button class="btn ghost" data-brm="${i}">✕</button>
        </div>`).join('')}
      </div>
      <button class="btn ghost" id="bAdd" style="margin-top:6px;">+ Add Bracket</button>
      <div class="modal-actions"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="bSave">Save Brackets</button></div>
    `);
    modalRoot.querySelectorAll('[data-close]').forEach(b=> b.onclick=closeModal);
    modalRoot.querySelector('#bAdd').onclick = ()=>{ sync(); brackets.push({min:0,max:null,rate:0}); draw(); };
    modalRoot.querySelectorAll('[data-brm]').forEach(b=> b.onclick = ()=>{ sync(); brackets.splice(Number(b.dataset.brm),1); draw(); });
    modalRoot.querySelector('#bSave').onclick = async ()=>{
      sync();
      const {error} = await sb.from('school_config').update({tax_brackets: brackets}).eq('school_id', STATE.currentUser.schoolId);
      if(error){ toast('Error saving: '+error.message); return; }
      STATE.taxBrackets = brackets;
      closeModal(); render(); toast('Tax brackets updated');
    };
  }
  function sync(){
    modalRoot.querySelectorAll('#bRows [data-brow]').forEach((el,i)=>{
      const maxVal = el.querySelector('.bMax').value;
      brackets[i] = {min:Number(el.querySelector('.bMin').value)||0, max: maxVal===''?null:Number(maxVal), rate:Number(el.querySelector('.bRate').value)||0};
    });
  }
  draw();
}

/* ============================= BOOT ============================= */
initAuth();
</script>
